# @package _global_

defaults:
  - _self_
  - /paths@_global_

#==============================================================================
#                             Runtime / Experiment
#==============================================================================
name: seeker
_target_: visuomotor.workspace.seeker_pretraining.TrainSeekerWorkspace

seed: 0
batch_size: 128
action_rep: absolute

obs_dropout: 0.0
visual_mode: external
image_size: 240 # resize 256 to 240 so 224 crop ratio is ~0.93

# Seeker mechanism ablations — override from CLI, e.g.
# vmstack train --config-name pretrain/seeker seeker_num_iters=1
seeker_num_iters: 3
seeker_disable_proprio: false
seeker_disable_head_gating: false

#==============================================================================
#                                Dataset / Task
#==============================================================================
# `n_demo` is interpreted per task for Seeker pretraining.
stage_total_steps: 5000

# Override from CLI when needed, e.g.
# vmstack train --config-name pretrain/seeker task_name=square_d2 n_demo=250
task_name: mimicgen_multitask_demo_100
dataset_path: ${paths.dataset_root}/${task_name}/${task_name}_lmdb
cache_dir: null
dataset_demo_count_mode: per_task

exp_name: "view-${visual_mode}_action-${action_rep}_demos-${n_demo}_iters-${seeker_num_iters}_noprop-${seeker_disable_proprio}_nogate-${seeker_disable_head_gating}_seed-${seed}"
n_demo: 100
action_dim: 10
horizon: 16
n_obs_steps: 1
n_action_steps: 8
n_latency_steps: 0

#==============================================================================
#                                    Policy
#==============================================================================
policy:
  noise_scheduler:
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: squaredcos_cap_v2
    variance_type: fixed_small # fixed_small_log can be unstable
    clip_sample: true # required when predict_epsilon=False
    prediction_type: epsilon

  num_inference_steps: 100
  diffusion_step_embed_dim: 128
  unet_channels: [128, 256, 512]
  kernel_size: 5
  n_groups: 8
  cond_predict_scale: true

#==============================================================================
#                                     EMA
#==============================================================================
ema:
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

#==============================================================================
#                                 DataLoaders
#==============================================================================
dataloader:
  batch_size: ${batch_size}
  num_workers: 8
  shuffle: true
  pin_memory: true
  persistent_workers: true
  sampler:
    type: task_balanced
    samples_per_epoch: 100000

#==============================================================================
#                                  Optimizer
#==============================================================================
optimizer:
  lr: 1.0e-4
  betas: [0.95, 0.999]
  eps: 1.0e-8
  weight_decay: 1.0e-6

#==============================================================================
#                                   Training
#==============================================================================
training:
  device: cuda:0
  debug: false
  resume: true

  # Optimization
  lr_scheduler: cosine
  lr_warmup_steps: 500
  total_steps: 30000

  # EMA
  use_ema: false

  # Training loop control (epochs)
  checkpoint_every: 10

  # Steps per epoch
  max_train_steps: null

  # Misc
  tqdm_interval_sec: 1.0

#==============================================================================
#                                   Logging
#==============================================================================
logging:
  project: visuomotor-pretrain
  resume: true
  mode: disabled
  name: ${name}
  group: ${task_name}
  job_type: train_visual_focus
  tags:
    - task=${task_name}
    - stage=visual_focus
    - model=seeker
    - demonstrations=${n_demo}
    - seed=${seed}
    - visual_mode=${visual_mode}
    - action=${action_rep}
    - seeker_num_iters=${seeker_num_iters}
    - seeker_disable_proprio=${seeker_disable_proprio}
    - seeker_disable_head_gating=${seeker_disable_head_gating}
  id: null

#==============================================================================
#                                Checkpointing
#==============================================================================
checkpoint:
  save_last_ckpt: false
  save_last_snapshot: false
  seeker_light_path: null

visualization:
  enabled: true
  num_samples: 6
  augmentation_preview: true
  save:
    images: true
    videos: true
  upload:
    images: false
    videos: false

#==============================================================================
#                                    Hydra
#==============================================================================
hydra:
  job:
    override_dirname: ${name}
  run:
    dir: experiments/${task_name}/${name}/${exp_name}
